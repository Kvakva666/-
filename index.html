<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коты-Воители: Эра Черной Луны</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0b0b0b; color: #e0e0e0; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .game-window { width: 100%; max-width: 450px; background: #141414; border: 2px solid #3a1c5c; border-radius: 12px; padding: 15px; box-sizing: border-box; }
        .screen { width: 100%; aspect-ratio: 1/1; position: relative; background: #000; border-radius: 8px; overflow: hidden; }
        .loc-img { width: 100%; height: 100%; object-fit: cover; }
        .loc-text { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.8); padding: 8px; font-size: 13px; text-align: center; }
        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; background: #1c1c1c; padding: 10px; border-radius: 6px; font-size: 13px; }
        .bar { background: #2b2b2b; height: 10px; border-radius: 4px; overflow: hidden; margin-top: 4px; }
        .fill { height: 100%; transition: width 0.3s; }
        .btn { background: #3a1c5c; color: #fff; border: 1px solid #5c2d91; padding: 12px; margin: 6px 0; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; box-sizing: border-box; }
        .btn-move { background: #1c2d5a; border-color: #294488; }
        .log { background: #080808; border: 1px solid #222; height: 100px; overflow-y: auto; padding: 8px; border-radius: 6px; font-size: 12px; margin-top: 10px; color: #a0a0a0; }
    </style>
</head>
<body>

<div class="game-window">
    <div class="screen">
        <img id="locImg" class="loc-img" src="https://githubusercontent.com">
        <div id="locDesc" class="loc-text">Загрузка...</div>
    </div>

    <div class="stats">
        <div>❤️ Здоровье: <span id="txtHp">200</span>/200<div class="bar"><div id="barHp" class="fill" style="background:#cf1414; width:100%;"></div></div></div>
        <div>🍖 Сытость: <span id="txtHunger">500</span>/500<div class="bar"><div id="barHunger" class="fill" style="background:#f1c40f; width:100%;"></div></div></div>
        <div style="grid-column: span 2; border-top: 1px solid #222; padding-top: 5px;">🎒 В лапах: <b id="txtInv" style="color:#1abc9c;">Ничего</b><br>⚠️ Состояние: <span id="txtStatus">Здоров</span></div>
    </div>

    <div id="actionArea">
        <button class="btn" onclick="gameAction('hunt')">🐾 Поохотиться (-7 сытости)</button>
        <button class="btn" onclick="gameAction('eat')">🍖 Съесть мышь (+30 сытости)</button>
        <div id="specialAction"></div>
    </div>

    <h4 style="margin: 10px 0 5px 0; font-size: 12px; color: #666;">ПЕРЕМЕЩЕНИЕ:</h4>
    <div id="navigationArea"></div>
    <div class="log" id="gameLog"></div>
</div>

<script>
    const locations = {
        "Полянка на Нейтралках": {
            img: "https://githubusercontent.com",
            desc: "Вечный мрак. Трава светится ядовито-зеленым. Вокруг кружат фиолетовые светлячки.",
            exits: ["Гигантское Дупло", "Старое Гнездо Двуногих"]
        },
        "Гигантское Дупло": {
            img: "https://suwalls.com",
            desc: "Лагерь Племени Теплого Света. Коты греются в коконах из светлячков. Короткая шерсть. Здесь чаще рождаются котята с крыльями.",
            exits: ["Полянка на Нейтралках"]
        },
        "Старое Гнездо Двуногих": {
            img: "https://suwalls.com",
            desc: "Лагерь Племени Пылающего Огня. Коты поклоняются огню. Во дворе лежат ледяные цветы, рассыпающиеся при касании.",
            exits: ["Полянка на Нейтралках"]
        }
    };

    let cat = { location: "Полянка на Нейтралках", hp: 100, hunger: 100, mice: 0, coals: 0, mutation: 0 };

    function loadGame() {
        let save = localStorage.getItem('github_cat_save');
        if (save) cat = JSON.parse(save);
        updateUI();
        log("Вы очнулись в вечной тьме. Прогресс сохранен.");
    }

    function saveGame() { localStorage.setItem('github_cat_save', JSON.stringify(cat)); }

    function log(msg) {
        let box = document.getElementById('gameLog');
        box.innerHTML += `<div>• ${msg}</div>`;
        box.scrollTop = box.scrollHeight;
    }

    function updateUI() {
        let loc = locations[cat.location];
        document.getElementById('locImg').src = loc.img;
        document.getElementById('locDesc').innerText = loc.desc;
        document.getElementById('txtHp').innerText = cat.hp;
        document.getElementById('barHp').style.width = cat.hp + "%";
        document.getElementById('txtHunger').innerText = cat.hunger;
        document.getElementById('barHunger').style.width = cat.hunger + "%";
        document.getElementById('txtInv').innerText = cat.mice > 0 ? `Мышь (${cat.mice} шт.)` : "Ничего";

        let statusTag = document.getElementById('txtStatus');
        if (cat.mutation === 0) { statusTag.innerText = "Здоров"; statusTag.style.color = "#2ecc71"; }
        if (cat.mutation === 1) { statusTag.innerText = "1 Стадия: Черный Кашель "; statusTag.style.color = "#f39c12"; }
        if (cat.mutation === 2) { statusTag.innerText = "2 Стадия: Искажающий Дар  (Рога и Ночное зрение!)"; statusTag.style.color = "#9b59b6"; }
        if (cat.mutation === 3) { statusTag.innerText = "3 Стадия: БЕЗУМИЕ "; statusTag.style.color = "#e74c3c"; }

        let specArea = document.getElementById('specialAction');
        if (cat.location === "Старое Гнездо Двуногих") {
            specArea.innerHTML = `<button class="btn" style="background:#e67e22; border-color:#d35400;" onclick="gameAction('search_coals')">🔥 Искать угли в печи</button>`;
        } else if (cat.mutation > 0 && cat.coals > 0) {
            specArea.innerHTML = `<button class="btn" style="background:#c0392b; border-color:#962d22;" onclick="gameAction('burn_wound')">🩸 Прижечь рану углями</button>`;
        } else { specArea.innerHTML = ""; }

        let navArea = document.getElementById('navigationArea');
        navArea.innerHTML = "";
        loc.exits.forEach(exit => {
            navArea.innerHTML += `<button class="btn btn-move" onclick="moveTo('${exit}')">🐾 Перейти в: ${exit}</button>`;
        });
    }

    function moveTo(target) {
        if (cat.mutation === 3) { log("Вы безумны и бегаете кругами!"); return; }
        cat.location = target;
        cat.hunger = Math.max(0, cat.hunger - 5);
        log(`Вы перешли в: ${target}. Потрачено 5 сытости.`);
        
        if (target === "Полянка на Нейтралках" && Math.random() < 0.3) {
            cat.hp = Math.max(0, cat.hp - 35);
            log(` НАПАЛА МУТИРОВАВШАЯ СОБАКА! Укус в плечо! Потеряно 35 HP.`);
            if (Math.random() < 1 && cat.mutation === 0) {
                cat.mutation = 1;
                log(" Рана загноилась. Начался Черный Кашель...");
            }
        }
        saveGame(); updateUI();
    }

    function gameAction(type) {
        if (cat.mutation === 3) return;
        if (type === 'hunt') {
            if (cat.hunger < 10) { log("Вы слишком голодны."); return; }
            cat.hunger -= 7;
            let chance = cat.mutation === 2 ? 0.9 : 0.5;
            if (Math.random() < chance) {
                cat.mice++; log(" Вы поймали мышь!");
                if (Math.random() < 0.3 && cat.mutation === 0) {
                    cat.mutation = 1; log(" Мышь была заражена! У вас начался кашель.");
                }
            } else { log("💨 Мышь убежала под ледяной куст."); }
        }
        if (type === 'eat') {
            if (cat.mice <= 0) return;
            cat.mice--; cat.hunger = Math.min(100, cat.hunger + 30);
            log("🍖 Вы съели мышь.");
        }
        saveGame(); updateUI();
    }

    setInterval(() => {
        if (cat.hunger > 0) {
            cat.hunger--;
            if (cat.mutation === 1 && Math.random() < 0.05) {
                cat.mutation = 2; log(" Болезнь укоренилась! У вас выросли рога и открылось Ночное Зрение!");
            }
        } else { cat.hp = Math.max(0, cat.hp - 20); log(" Вы умираете от голода!"); }
        saveGame(); updateUI();
    }, 10000);

    window.onload = loadGame;
</script>
</body>
</html>
